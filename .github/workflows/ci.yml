name: ci

on:
  pull_request:
  push:
    branches: [main]
  workflow_call:

permissions:
  contents: read

jobs:
  # The tests against PostgreSQL 18 in docker: a primary and three standbys,
  # behind TCP proxies the tests stop and start.
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
      - name: Tool versions
        run: |
          set -euo pipefail
          go version
          docker --version
          openssl version
      - name: Tests
        run: go test -race ./...

  # golangci-lint v2.15.0 needs Go 1.26 or later, and setup-go sets
  # GOTOOLCHAIN=local, so this job does not take Go from go.mod.
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7.0.0
        with:
          go-version: '1.27'
      - name: Tool versions
        run: |
          set -euo pipefail
          go version
          shellcheck --version
      # golangci-lint cannot turn off nolint comments, so this step fails on any.
      - name: No nolint comments
        run: |
          set -euo pipefail
          status=0
          grep -rin --include='*.go' nolint . || status=$?
          if ((status == 0)); then
            echo "lint: nolint comments are not allowed" >&2
            exit 1
          fi
          if ((status != 1)); then
            exit "$status"
          fi
      - name: golangci-lint
        run: |
          set -euo pipefail
          lint=github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.15.0
          go run "$lint" config verify
          go run "$lint" run
      - name: shellcheck
        run: shellcheck release-check.sh testdata/cluster.sh
